ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/lidar
    frame_id: laser_frame
    ignore_array: ""

    baudrate: 230400
    lidar_type: 1
    device_type: 0
    sample_rate: 9
    abnormal_check_count: 4

    resolution_fixed: true
    reversion: false
    inverted: false
    auto_reconnect: true
    isSingleChannel: false
    intensity: true
    support_motor_dtr: true
    invalid_range_is_inf: true

    angle_min: -180.0
    angle_max: 180.0
    range_min: 0.12
    range_max: 16.0
    frequency: 10.0
