slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping
    debug_logging: false
    use_map_saver: true

    throttle_scans: 8
    transform_publish_period: 0.20
    map_update_interval: 5.0
    resolution: 0.05
    minimum_time_interval: 1.0
    transform_timeout: 0.5
    tf_buffer_duration: 20.0
    stack_size_to_use: 40000000

    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.15
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 3.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.8
    loop_search_maximum_distance: 2.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55
